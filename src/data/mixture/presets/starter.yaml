# 55k starter mixture — docs/dataset-strategy.md §6 ("Starter subset (55,000)").
# choice 12,000 · preference 20,000 (HH-RLHF only) · scoring 5,000 ·
# probability 4,600 · abstention 6,600 · risk 6,800 = 55,000.
#
# HelpSteer2 is scored only: PreferenceAdapter consumes HH-RLHF chosen/rejected
# pairs and cannot consume HelpSteer2 ratings, so the 4,000 preference rows
# formerly attributed to HelpSteer2 are now attributed to HH-RLHF. Family and
# total row counts are unchanged.
#
# `fingerprint` is deliberately "" while the split-manifest fingerprint is
# unresolved (recorded at acquisition time); load with
# `load_preset("starter")` and pass the recorded fingerprint to `sample()`.
# Source labels are declarative ids resolved at acquisition time; the
# admission/license record lives in the acquisition manifest, not here.
name: starter
fingerprint: ""
families:
  choice: {source: "cais/mmlu#auxiliary_train", rows: 12000}
  preference: {source: "Anthropic/hh-rlhf", rows: 20000}
  scoring: {source: "nvidia/HelpSteer2", rows: 5000}
  probability:
    - {source: "truthfulqa/truthful_qa", rows: 1600}
    - {source: "cais/mmlu#auxiliary_train-derived-binary", rows: 3000}
  abstention: {source: "AbstentionBench-derived", rows: 6600}
  risk: {source: "nvidia/Aegis-AI-Content-Safety-Dataset-2.0", rows: 6800}

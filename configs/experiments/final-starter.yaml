# RAPPORT final Stage-B run on the fixed real corpus.
#
# Mixture: starter (55k train rows). The `full` 115.6k mixture cannot be
# bound from the admitted sources: it requires 12,000 abstention TRAIN rows,
# but AbstentionBench is ~40k rows in total and yields ~11.2k train rows
# after cleaning, the 70/15/15 group-disjoint split and 13-gram quarantine.
# The starter mixture binds with margin on all six families.
#
# Choices, with reasons:
#   init: scratch      - the audited partial BGE init copies 49/199 tensors and
#                        mismatches BERT post-LN+learned-positions against this
#                        trunk's pre-RMSNorm+RoPE; it measured WORSE than scratch
#                        (0.7425 vs 0.7876) and is not worth the risk here.
#   weight_mode: fixed - documented section 3.2 defaults. The learned arm
#                        saturates at its 4.0 weight cap (total loss reached
#                        -3.99), collapsing to a uniform 4x on all seven tasks
#                        including the noisy scoring (Spearman ~0.01) and risk
#                        families; fixed weights downweight those to 0.5.
arm: final-starter
title: 55k final run (Stage B, fixed weights, corrected corpus)
question: does the model meet the pre-registered criteria on corrected real data?
init: scratch
variant: compact
layers: 12
hidden: 384
readout: cosine
weight_mode: fixed
head_only: false
ordering: fingerprint
mixture: starter
mixture_rows: 55000
max_length: 512
infer_max_length: 512
seeds: [13]
data_fingerprint: ""
epochs: 8
batch_size: 64
lr: 3.0e-4
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true
keep_last_n: 3

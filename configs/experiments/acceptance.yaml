# RAPPORT acceptance run — Stage B on the 115.6k full mixture
# (docs/training-strategy.md §1; counts per docs/dataset-strategy.md §6).
# Pre-registered pass/fail criteria Y1–Y14 live in docs/evaluation.md §8 and
# are rendered by TASK-21's report command; this config does NOT compute
# verdicts. Acceptance requires beating B3 (TF-IDF floor) and B4 (frozen
# bge-small + cosine); B8 (teacher) is reported, never targeted.
#
# OOD protocol (docs/evaluation.md §4, docs/dataset-strategy.md §2/§6):
# UltraFeedback-binarized is the designated source-held-out OOD set. It
# contributes ZERO rows to train and dev; ~200 MB is downloaded solely to
# build the 8,000-row OOD evaluation. If its cache cannot be built, the OOD
# set becomes the preference rows of an independent HH-RLHF domain cluster
# never sampled for training, recorded in the manifest (substitution rule,
# docs/dataset-strategy.md §6).
# Verdicts (Y1–Y14) are produced by TASK-21's report command; this config
# does not compute verdicts.
arm: acceptance
title: 115.6k acceptance run (Stage B)
question: does the default configuration pass the pre-registered acceptance criteria?
init: scratch            # this architecture trains from scratch; a pretrained-trunk loader is not implemented
variant: compact           # RAPPORT-C — 12 layers x 384 hidden, 33.46M (Y11-eligible)
layers: 12
hidden: 384
readout: cosine
weight_mode: learned       # floor 0.05, cap 4.0
head_only: false
ordering: fingerprint       # deterministic fingerprint order; the curriculum arm is not implemented
mixture: full              # packaged preset, counts asserted within 1% of docs/dataset-strategy.md §6
mixture_rows: 115600
max_length: 512
infer_max_length: 1024     # Y9/Y10 latency measured at batch 1 / batch 32 on T4 FP16
seeds: [13, 29, 47]
data_fingerprint: ""       # recorded at acquisition time from the split manifest; required key, placeholder value
ood_source: "UltraFeedback-binarized"  # withheld OOD source; zero train/dev rows; 8,000-row OOD eval
y2_comparator: "B3"                     # Y2 (held-out source) comparator: TF-IDF (char + word n-grams) + logistic regression — docs/evaluation.md §2 B3
epochs: 8                  # early stop on dev loss, patience 2
batch_size: 64
lr: 3.0e-4                 # encoder LR; head LR below
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true
teacher: Qwen/Qwen3-1.7B   # Stage C reference; KD arm only via configs/experiments/a6-data.yaml after the T15 gate

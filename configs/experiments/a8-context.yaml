# Ablation A8 — context length (docs/evaluation.md §5).
# Question: is RoPE extension safe?
# Pass condition: no more than a 2-point drop at 1024 tokens vs 512.
# Arms: 512 train / 1024 infer (RoPE extension) | 512 train / 512 infer.
# Verdicts (Y1–Y14) are produced by TASK-21's report command; this config
# does not compute verdicts.
arm: A8
title: context
question: is RoPE extension safe?
init: scratch            # this architecture trains from scratch; a pretrained-trunk loader is not implemented
variant: compact           # ultra 6/320 | compact 12/384 (recommended) | large 16/448
layers: 12
hidden: 384
readout: cosine
weight_mode: learned
head_only: false
ordering: fingerprint       # deterministic fingerprint order; the curriculum arm is not implemented
mixture: starter           # 55k — ablations run on the starter; acceptance re-runs the winner
mixture_rows: 55000
context: 512-train-1024-infer
max_length: 512            # training context
infer_max_length: 1024     # inference context for this arm (RoPE extension)
seeds: [13, 29, 47]
data_fingerprint: ""       # recorded at acquisition time from the split manifest; required key, placeholder value
epochs: 8
batch_size: 64
lr: 3.0e-4
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true
variants:
  - {name: 512-train-1024-infer, context: 512-train-1024-infer, max_length: 512, infer_max_length: 1024}
  - {name: 512-512, context: 512-512, max_length: 512, infer_max_length: 512}

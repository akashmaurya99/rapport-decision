# Ablation A6 — data scale and KD (docs/evaluation.md §5).
# Question: payoff per example.
# Pass condition: each stage's gain over its predecessor >= 1 point, else the
# stage is dropped. Arms: 55k | 115.6k | 115.6k+KD | 115.6k uniform order.
# KD arm requires the T15 gate to pass (teacher >= supervised + 3 points on
# dev, KD student >= supervised + 1 point); otherwise the arm is reported as a
# negative result, not silently run.
# Seed subset: A6 is the one arm allowed a seed subset — four data conditions
# x 8 epochs on one T4 session; the two endpoint arms (55k, 115.6k) carry the
# full 3-seed replication elsewhere (A1/A7), so A6 runs seed 13 only.
# Verdicts (Y1–Y14) are produced by TASK-21's report command; this config
# does not compute verdicts.
arm: A6
title: data
question: payoff per example
init: bge-small
variant: compact           # ultra 6/320 | compact 12/384 (recommended) | large 16/448
layers: 12
hidden: 384
readout: cosine
weight_mode: learned
head_only: false
ordering: curriculum
mixture: full              # default arm; alternatives below
mixture_rows: 115600
kd: false                  # true only for the 115.6k+KD arm, and only after the T15 gate passes
seeds: [13]                # subset permitted for A6 (see header)
data_fingerprint: ""       # recorded at acquisition time from the split manifest; required key, placeholder value
epochs: 8
batch_size: 64
lr: 3.0e-4
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true
variants:
  - {name: starter-55k, mixture: starter, mixture_rows: 55000}
  - {name: full-115.6k, mixture: full, mixture_rows: 115600}
  - {name: full-115.6k-kd, mixture: full, mixture_rows: 115600, kd: true}
  - {name: full-115.6k-uniform-order, mixture: full, mixture_rows: 115600, ordering: uniform}

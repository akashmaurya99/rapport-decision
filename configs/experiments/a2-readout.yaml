# Ablation A2 — readout (docs/evaluation.md §5).
# Question: is cosine enough?
# Pass condition: cosine within 2 points of cross-attention; else revise the spec.
# Arms: cosine marker | joint cross-attention block | CLS-pooled MLP.
# Verdicts (Y1–Y14) are produced by TASK-21's report command; this config
# does not compute verdicts.
arm: A2
title: readout
question: is cosine enough?
init: scratch            # this architecture trains from scratch; a pretrained-trunk loader is not implemented
variant: compact           # ultra 6/320 | compact 12/384 (recommended) | large 16/448
layers: 12
hidden: 384
readout: cosine            # this arm; cosine distance between marker and option states
readout_alternates: [cross-attn, cls-pooled]
weight_mode: learned
head_only: false
ordering: fingerprint       # deterministic fingerprint order; the curriculum arm is not implemented
mixture: starter           # 55k — ablations run on the starter; acceptance re-runs the winner
mixture_rows: 55000
seeds: [13, 29, 47]
data_fingerprint: ""       # recorded at acquisition time from the split manifest; required key, placeholder value
epochs: 8
batch_size: 64
lr: 3.0e-4
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true
variants:
  - {name: cosine, readout: cosine}
  - {name: cross-attn, readout: cross-attn}   # joint cross-attention block over markers and options
  - {name: cls-pooled, readout: cls-pooled}   # CLS-pooled MLP head

# RAPPORT pretrained-init starter run — Stage A (BGE) + Stage B on 55k.
# Same audited partial BGE init as pretrained-full.yaml; the 55k starter
# mixture is the first controlled stage in docs/training-strategy.md §1.
arm: pretrained-starter
title: 55k starter run with audited BGE initialization (Stage A+B)
question: does audited BGE initialization beat scratch training on the 55k starter mixture?
init: bge-small-en-v1.5
variant: compact
layers: 12
hidden: 384
readout: cosine
weight_mode: learned
head_only: false
ordering: fingerprint
mixture: starter
mixture_rows: 55000
max_length: 512
infer_max_length: 512
seeds: [13]
data_fingerprint: ""
epochs: 8
batch_size: 64
lr: 3.0e-4
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.05
schedule: cosine
grad_clip: 1.0
dropout: 0.1
label_smoothing: 0.0
optimizer: adamw
fp16: true

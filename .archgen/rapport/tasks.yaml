      - tests/unit/training/multitask/**
    acceptance:
      - "learned task weights are bounded by a floor of 0.05 and a cap of 4.0, logged every epoch, and a task at the floor for two consecutive epochs is surfaced as a WEIGHT_COLLAPSE event (covers FR-TRAIN-03)"
      - the resolved per-task weight vector is written to the manifest and to the run registry (covers FR-TRAIN-03)
      - a fixed-weight arm is registered for ablation A4
    status: done

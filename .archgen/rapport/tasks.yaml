      - TASK-06
    file_ownership:
      - src/training/losses.py
      - tests/unit/training/test_losses.py
    acceptance:
      - "every loss matches a hand-computed value within 1e-5 on a fixed fixture, including the masked and empty-pair cases (covers FR-TRAIN-01)"
      - the abstention loss is masked when answerable is unset and the risk loss is masked when no risk labels are present
      - a non-finite loss surfaces a typed exception and never reaches the optimizer
    status: done
  - id: TASK-12
    title: FP16 trainer core with checkpoint and resume
    depends_on:
      - TASK-05
      - TASK-06
      - TASK-11
      - TASK-13
      - TASK-20
    file_ownership:
      - src/training/core/**
      - tests/unit/training/core/**
    acceptance:
      - "the trainer writes a checkpoint every 500 steps and at epoch end, preserves the sampler offset, and resumes to the same loss trajectory (covers FR-TRAIN-02)"
      - "a non-finite gradient skips the optimizer step, increments a counter, and does not advance the step count (covers E5) (covers FR-TRAIN-04)"
      - a checkpoint whose file hash mismatches is rejected with a typed error and is never loaded (covers E6)
      - "model, optimizer, scaler and scheduler state round-trip through save and load with byte-equal top tensors (covers FR-TRAIN-02)"
    status: done
  - id: TASK-13

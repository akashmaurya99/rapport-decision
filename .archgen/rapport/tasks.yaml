      - "metrics also compute per-category risk recall at a fixed false-positive rate, over-refusal rate, and a keyword-rule risk baseline for the same categories, each against a hand-computed fixture (covers FR-EVAL-01)"
      - every metric has a unit test against a hand-computed fixture including the all-one-class and degenerate-option cases (covers FR-EVAL-01)

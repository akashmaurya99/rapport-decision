      - TASK-09
    file_ownership:
      - src/data/splits/**
      - tests/unit/data/splits/**
    acceptance:
      - splitting by group_id into 70/15/15 leaves no group in two splits; the assertion fails the build otherwise (covers FR-DATA-06)
      - "the split manifest records the fingerprint, counts per family per split, the dedup threshold, a group_overlap of zero and the required ood_source field naming the withheld UltraFeedback-binarized; any positive overlap is a fatal error (covers E4)"
      - "one entire source is withheld for the OOD test and contributes zero rows to train and dev, and its identity is recorded in the manifest"
    status: done
  - id: TASK-11
    title: Multi-task loss functions
    depends_on:

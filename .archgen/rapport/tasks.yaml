# schema_version: 1
# generator: archgen v0.1.7
# comment lines are preserved by archgen_tasks{set_status}
# Every VALUE is QUOTED. All globs repo-root-relative and disjoint.
tasks:
  - id: TASK-01
    title: "Config resolution, validation and run manifests"
    depends_on: []
    file_ownership:
      - src/config/**
      - tests/unit/config/**
      - configs/base.yaml
    artifacts:
      - configs/base.yaml
    acceptance:
      - load_config resolves a YAML config plus RAPPORT_* environment overrides and fails with a typed error naming the unknown key (covers FR-CONFIG-01)
      - "a run manifest is written for every run and records git sha, config hash, data fingerprint, seed, device and the versions of python, torch, transformers and datasets (covers FR-CONFIG-02)"
      - "seeds are set for random, numpy, torch and CUDA, and the resolved determinism mode is readable from the manifest (covers FR-CONFIG-03)"
    status: done
  - id: TASK-02
    title: "Repository skeleton, toolchain, CI and T4 probe"
    depends_on: []
    file_ownership:
      - pyproject.toml
      - Makefile
      - README.md
      - ".github/workflows/ci.yml"
      - src/__init__.py
      - tests/__init__.py
    artifacts:
      - README.md
    acceptance:
      - "pip install -e . succeeds and python -c 'import rapport; print(rapport.__version__)' prints a version"
      - "ruff check . and mypy src both exit 0, and the CI workflow runs lint, typecheck and pytest on push"
      - "the T4 probe prints compute capability, VRAM and available SDPA backends, and the resolved values are written to the run manifest (covers FR-CONFIG-02)"
    status: done
  - id: TASK-03
    title: DecisionExample contract and normalization
    depends_on:
      - TASK-01
    file_ownership:
      - src/data/core/**
      - tests/unit/data/core/**
    acceptance:
      - "normalize_example rejects an empty goal, fewer than two options, a duplicate option after normalization, and an out-of-range chosen index, each with a distinct typed error code (covers E3) (covers FR-DATA-01)"
      - "example_id is order-invariant: permuting options leaves the sha256 unchanged, and a fixture round-trips through parse, validate and serialize with an identical hash"
      - "normalization applies Unicode NFC, strips HTML and collapses whitespace, and records nothing that a source did not provide"
    status: done
  - id: TASK-04
    title: "Tokenizer, special tokens and length bucketing"
    depends_on:
      - TASK-01
      - TASK-02
      - TASK-03
    file_ownership:
      - src/tokenization/**
      - tests/unit/tokenization/**
    acceptance:
      - "the special tokens <task>, <goal>, <state>, <opt> and </opt> are added and round-trip with every marker boundary intact (covers FR-TOK-01)"
      - "encode_example respects the 512-token budget and truncates long states from the end, writing a truncation flag on the example and a per-source count in the manifest (covers FR-TOK-02)"
      - "length bucketing produces at most three distinct batch shapes across 10,000 examples from the starter fixture (covers FR-TOK-02)"
    status: done
  - id: TASK-05
    title: Encoder trunk and parameter accounting
    depends_on:
      - TASK-01
      - TASK-02
    file_ownership:
      - src/model/core/**
      - tests/unit/model/core/**
    acceptance:
      - RapportConfig renders the layer table in docs/architecture-spec.md and count_parameters reports each component within 1 percent of it; the RAPPORT-C trunk is 21.24M parameters (covers FR-MODEL-01)
      - "the trunk emits [B, 512, 384] for a fixed batch and RoPE with base 10000 is the only position mechanism in the implementation"
      - the counter fails the build when the implementation and the spec disagree by more than 1 percent (covers FR-MODEL-01)
    status: done
  - id: TASK-06
    title: "Marker readout, six heads and model assembly"
    depends_on:
      - TASK-05
      - TASK-04
    file_ownership:
      - src/model/head/**
      - tests/unit/model/head/**
    artifacts:
      - src/model/head/model.py
    acceptance:
      - "for batch sizes 1, 32 and n options in 2..8 the forward pass returns exactly n scores per example, and n of 1 or 9 is refused by input validation with a typed error (covers E2) (covers FR-MODEL-04)"
      - "permuting the options permutes the scores by the same permutation within 1e-4, and no ordinal embedding or order-dependent path exists in the option markers (covers FR-MODEL-02)"
      - "all six heads return the shapes declared in docs/architecture-spec.md §4 and docs/prd.md FR-MODEL-03: choice_logits[n], scores[n], probability[1], confidence[1], answerable[1], risk[8] (covers FR-MODEL-03)"
      - "a single forward pass encodes the state and all options jointly, with no per-option forward pass in the default path (covers FR-MODEL-04)"
    status: done
  - id: TASK-07
    title: Dataset acquisition and provenance manifests
    depends_on:
      - TASK-01
      - TASK-03
    file_ownership:
      - src/data/acquire/**
      - tests/unit/data/acquire/**
    acceptance:
      - "every source writes a manifest with license, declared and observed row counts, sha256 and acquisition date; a source with no license is marked quarantine and the mixture refuses it (covers FR-DATA-02)"
      - no corpus over 200 MB is materialized on disk; acquisition uses streaming and writes filtered parquet shards
      - "acquisition is idempotent: a re-run verifies existing shards by hash and skips re-downloading them"
    status: done
  - id: TASK-08
    title: "Deduplication, quality filtering and contradiction audit"
    depends_on:
      - TASK-03
      - TASK-07
    file_ownership:
      - src/data/clean/**
      - tests/unit/data/clean/**
    acceptance:
      - exact dedup removes byte-identical normalized rows and reports per-source counts; near-dedup removes near-duplicates at Jaccard at least 0.9 and records the threshold (covers FR-DATA-03)
      - rules Q1 to Q6 each increment a named counter and the rejection report sums to the removed rows; no rule deletes a hard example for being hard (covers FR-DATA-04)
      - groups with contradictory gold labels are moved to a contested file with their count reported and no label is silently chosen
    status: done
  - id: TASK-09
    title: Six task-family adapters into the unified schema
    depends_on:
      - TASK-03
    file_ownership:
      - src/data/adapters/**
      - tests/unit/data/adapters/**
    acceptance:
      - "the six adapters map choice, preference, scoring, probability, abstention and risk sources into DecisionExample with source, task_family and group_id set; the MMLU-Pro adapter reports the 10-to-8 option reduction with its seed, the probability adapter derives its binary rows from auxiliary_train by formula and reports the derived count, and the AbstentionBench adapter reports per-subset conversion rates (covers FR-DATA-05)"
      - "an unmappable record is counted and rejected with a typed reason, never silently skipped"
      - option order is shuffled at ingest with a recorded seed and the original order is retained for reconstruction
    status: done
  - id: TASK-10
    title: "Deterministic group-aware splits, leakage checks and fingerprints"
    depends_on:

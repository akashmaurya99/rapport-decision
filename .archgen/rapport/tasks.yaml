      - the 55k starter and the 115.6k full mixture reproduce the counts in docs/dataset-strategy.md within 1 percent (covers FR-DATA-07)
      - "configs/experiments contains one YAML per ablation arm A1 to A8 declared in docs/evaluation.md (each naming its init, seed set and data fingerprint) plus configs/experiments/starter.yaml (the 55k run) and configs/experiments/acceptance.yaml (the 115.6k run, whose config records the withheld OOD source UltraFeedback-binarized and the Y2 comparator)"
    status: done

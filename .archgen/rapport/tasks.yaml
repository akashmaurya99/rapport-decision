      - "the distillation gate aborts and records a negative result when the teacher fails to load or scores below the supervised student by 3 points on dev, or the KD student is not at least 1 point above it (covers E8) (covers FR-DISTILL-02)"
      - the teacher runs locally inside the runtime and no network call is made beyond its one-time download (covers FR-DISTILL-01)

      - tests/unit/calibration/**
    acceptance:
      - "per-bucket temperatures are fitted by 5-fold group-aware cross-fitting on dev logits with an NLL grid search, and every bucket stores its item count; a bucket with 50-200 items uses Platt scaling instead of a single temperature, and a bucket below 50 items inherits the pooled temperature and is flagged (covers FR-CALIB-01)"
      - "per-category risk thresholds are fitted on dev to hold false-positive rate at most 0.10 on the dev safe rows drawn from Aegis safe-labeled prompts, frozen into the calibration map before test is read; the XSTest safe set is never used for fitting and remains the Y8 measurement set (covers FR-CALIB-03)"
      - the calibration module computes its own pooled ECE and bucket-macro ECE plus Brier score and NLL and does not depend on the evaluation module (covers FR-CALIB-02)
      - the abstention threshold derives from the declared utility triple and emits a risk-coverage curve; the default triple yields a threshold of 0.75 (covers FR-CALIB-03)
    status: done

  - "general world knowledge beyond the measurable decision benchmarks"
  - "multilingual or multimodal inputs in v1"
  - "reinforcement learning in the first release"
  - "state-of-the-art claims against frontier LLMs"
personas:
  - "application engineer: needs one forward pass to return a choice plus a calibrated probability, so the caller can route or abstain without parsing text"
  - "research reviewer: needs every reported number to come from a named config, seed and data fingerprint"
  - "model operator: needs a checkpoint that resumes after a Colab disconnect and exports to ONNX INT8"
nfrs:
  - "Performance: batch-1 median latency at most 12 ms on T4 FP16 for 512 tokens and 8 options"
  - "Performance: throughput at least 300 decisions per second at batch 32 on T4"
  - "Memory: peak training VRAM at most 8 GB at batch 64 so the runtime retains headroom"
  - "Size: at most 35M parameters and at most 140 MB FP32 serialized"
  - "Reliability: a killed training process resumes from the last checkpoint with an identical data order"
  - "Reproducibility: identical config, seed and data fingerprint reproduce metrics within 0.5 accuracy points"
  - "Security: no dataset row leaves the runtime; the teacher runs locally and its outputs are cached to disk"
  - "i18n: English only; all text normalized to NFC and lowercased only for deduplication keys"
out_of_scope:
  - "distributed or multi-GPU training"
  - "custom CUDA kernels"
  - "pretraining a new tokenizer from raw text"
  - "human evaluation studies"
stack:
  language: "Python"
  runtime: "CPython 3.11 with PyTorch 2.x and CUDA 12.1 on Colab"
  hosting: "local Colab runtime plus Google Drive for checkpoints"
integrations:
  - "Hugging Face datasets and transformers for corpus access and the frozen baselines"
  - "ONNX Runtime for INT8 CPU export"
  - "Qwen3-1.7B in 4-bit as the optional local teacher"
compliance:
  - "every corpus carries its license in the acquisition manifest; CC-BY-SA and undeclared-license sources are quarantined from the training mixture until reviewed"
  - "no personal data is collected; Reddit-derived corpora are used under their published research licenses"
risks:
  - "the 25M-35M regime may sit below the capability floor implied by published 0.6B typed decision models"
  - "label noise and annotation-convention mismatch dominate small-model accuracy"
  - "pooled calibration metrics can hide large per-option-count miscalibration"
  - "Colab session limits interrupt long runs without checkpoint resume"
forks:
  - question: "What is RAPPORT v1's decision domain"
    answer: "A curated multi-task decision bench with five head families over six bounded task families"
    rationale: "measurable, license-clean, and small enough that 25M-35M parameters is a defensible operating point"
  - question: "Which distillation teacher"
    answer: "Teacher-free v1, then a local 4-bit 1.7B-3B teacher for Stage C only, behind a pre-registered usefulness gate"
    rationale: "keeps every acceptance runnable offline and free, and makes a weak teacher an abortable experiment rather than a dependency"
  - question: "What sequence budget"
    answer: "Train at 512 tokens with length bucketing, extend to 1024 at inference through RoPE base scaling"
    rationale: "state plus eight options fits in 512; 1024 is an extrapolation that must be measured, not assumed"

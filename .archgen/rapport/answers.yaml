problem: "Bounded decisions (choose, rank, score, judge risk, abstain) are currently made by large generative models whose cost and latency scale with output tokens, or by fine-tuned classifiers that output a label without usable probabilities. Published 2026 evidence shows typed decision models are viable at 0.8B-27B parameters but leaves the 5M-60M regime unmeasured, and reports that their weakest behaviours are abstention and option-position bias."
success_criteria:
  - text: "RAPPORT-C beats a TF-IDF logistic-regression baseline by at least 8 accuracy points in-distribution and at least 5 points on a held-out source"
    feeds: "prd.metrics"
  - text: "Option-order permutation changes accuracy by at most 0.5 points and any score by at most 1e-4"
    feeds: "prd.metrics"
  - text: "Bucket-macro expected calibration error is at most 0.05 after per-bucket cross-fitted temperature scaling"
    feeds: "prd.metrics"
  - text: "At 80 percent coverage, selective accuracy exceeds full-coverage accuracy by at least 5 points"
    feeds: "prd.metrics"
  - text: "Batch-1 median decision latency is at most 12 ms on T4 and at most 150 ms for INT8 CPU inference"
    feeds: "prd.metrics"
  - text: "Total parameter count is at most 35M and the serialized artifact is at most 140 MB in FP32"
    feeds: "prd.metrics"
constraints:
  - "Google Colab Free, one Tesla T4, 16 GB VRAM, sm_75, no bfloat16 tensor cores"
  - "PyTorch primary framework; FP16 mixed precision with loss scaling"
  - "No paid service may be required for any acceptance criterion"
  - "Training must survive a Colab session interruption through checkpoint resume"
  - "English-only v1, single-label and multi-label decisions over a bounded option set"
non_goals:
